<div class="callback-container">
  @if (loading()) {
    <div class="loading">
      <div class="spinner" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="loading-text">Completing sign-in, please wait...</p>
    </div>
  }

  @if (!loading() && error()) {
    <div class="error" role="alert">
      {{ error() }}
    </div>

    <a class="return-link" routerLink="/">Return to Login</a>
  }
</div>
